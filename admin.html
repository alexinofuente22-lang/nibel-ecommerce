<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - NIBEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow">
        <h1 class="text-xl font-bold tracking-wide">NIBEL <span class="text-xs text-amber-400 font-normal">Panel Administrativo</span></h1>
        <button id="btn-cerrar-sesion" onclick="cerrarSesion()" class="hidden text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-white font-medium">Cerrar Sesión</button>
    </header>

    <div class="max-w-4xl mx-auto p-6">

        <!-- Formulario de Login -->
        <section id="seccion-login" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Acceso Administrador</h2>
            <div id="error-login" class="hidden mb-3 p-2 bg-red-100 text-red-700 text-sm rounded"></div>
            <form onsubmit="iniciarSesion(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Correo Electrónico</label>
                    <input id="login-email" type="email" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Contraseña</label>
                    <input id="login-password" type="password" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white py-2 rounded font-semibold hover:bg-slate-800 text-sm">
                    Ingresar al Panel
                </button>
            </form>
        </section>

        <!-- Panel de Gestión -->
        <section id="seccion-panel" class="hidden space-y-8">
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 id="form-titulo" class="text-lg font-bold text-gray-800">Registrar Nueva Prenda</h3>
                    <button id="btn-cancelar-edicion" onclick="cancelarEdicion()" class="hidden text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded font-medium">
                        Cancelar Edición
                    </button>
                </div>

                <form id="form-producto" onsubmit="guardarOActualizarProducto(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                    <!-- Campo oculto para el ID si se edita -->
                    <input type="hidden" id="prod-id">
                    <input type="hidden" id="prod-imagen-url-existente">

                    <div>
                        <label class="block mb-1 font-medium">Código</label>
                        <input id="prod-codigo" placeholder="Ej: NIBEL-002" required class="w-full border rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">Nombre de la Prenda</label>
                        <input id="prod-nombre" placeholder="Ej: Chompa Cuello Alto Alpaca" required class="w-full border rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">Precio (S/)</label>
                        <input id="prod-precio" type="number" step="0.50" placeholder="140.00" required class="w-full border rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">Stock Inicial / Disponible</label>
                        <input id="prod-stock" type="number" placeholder="10" required class="w-full border rounded px-3 py-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block mb-1 font-medium">Foto de la Chompa (opcional si ya tiene)</label>
                        <input id="prod-foto" type="file" accept="image/*" class="w-full border rounded px-3 py-2 bg-gray-50">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block mb-1 font-medium">Descripción de la Lana y Acabado</label>
                        <textarea id="prod-desc" rows="2" placeholder="Detalla la pureza de la fibra y tejido..." required class="w-full border rounded px-3 py-2"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" id="btn-guardar" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded text-sm transition">
                            Guardar Producto en PostgreSQL
                        </button>
                    </div>
                </form>
            </div>

            <!-- Listado de Inventario -->
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Inventario en Tiempo Real</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-3">Foto</th>
                                <th class="p-3">Código</th>
                                <th class="p-3">Nombre</th>
                                <th class="p-3">Precio</th>
                                <th class="p-3">Stock</th>
                                <th class="p-3 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-inventario" class="divide-y">
                            <tr><td colspan="6" class="p-3 text-gray-500">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        const API_URL = 'https://nibel-api.onrender.com';
        let token = localStorage.getItem('nibel_token') || null;
        let productosMemoria = [];

        if (token) mostrarPanel();

        async function iniciarSesion(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('error-login');

            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (!res.ok) throw new Error('Credenciales incorrectas');
                const data = await res.json();
                token = data.access_token;
                localStorage.setItem('nibel_token', token);
                errorDiv.classList.add('hidden');
                mostrarPanel();
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('hidden');
            }
        }

        function mostrarPanel() {
            document.getElementById('seccion-login').classList.add('hidden');
            document.getElementById('seccion-panel').classList.remove('hidden');
            document.getElementById('btn-cerrar-sesion').classList.remove('hidden');
            cargarInventario();
        }

        function cerrarSesion() {
            localStorage.removeItem('nibel_token');
            token = null;
            document.getElementById('seccion-login').classList.remove('hidden');
            document.getElementById('seccion-panel').classList.add('hidden');
            document.getElementById('btn-cerrar-sesion').classList.add('hidden');
        }

        async function cargarInventario() {
            const res = await fetch(`${API_URL}/productos`);
            productosMemoria = await res.json();
            const tabla = document.getElementById('tabla-inventario');
            
            if (productosMemoria.length === 0) {
                tabla.innerHTML = '<tr><td colspan="6" class="p-3 text-gray-500">Sin existencias registradas.</td></tr>';
                return;
            }

            tabla.innerHTML = productosMemoria.map(p => `
                <tr>
                    <td class="p-3">
                        <img src="${p.imagen_url || 'https://via.placeholder.com/60?text=Lana'}" class="w-12 h-12 object-cover rounded border">
                    </td>
                    <td class="p-3 font-semibold">${p.codigo}</td>
                    <td class="p-3">${p.nombre}</td>
                    <td class="p-3 font-medium">S/ ${parseFloat(p.precio).toFixed(2)}</td>
                    <td class="p-3">${p.stock} unid.</td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="prepararEdicion(${p.id_producto})" 
                                class="text-xs font-semibold text-amber-700 hover:text-amber-900 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-2.5 py-1.5 rounded-md transition shadow-sm">
                            Editar
                        </button>
                        <button onclick="eliminarPrenda(${p.id_producto}, '${p.nombre.replace(/'/g, "\\'")}')" 
                                class="text-xs font-semibold text-red-600 hover:text-red-800 bg-red-50 hover:bg-red-100 border border-red-200 px-2.5 py-1.5 rounded-md transition shadow-sm">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function prepararEdicion(id) {
            const prod = productosMemoria.find(p => p.id_producto === id);
            if (!prod) return;

            // Llenar campos
            document.getElementById('prod-id').value = prod.id_producto;
            document.getElementById('prod-codigo').value = prod.codigo;
            document.getElementById('prod-nombre').value = prod.nombre;
            document.getElementById('prod-precio').value = prod.precio;
            document.getElementById('prod-stock').value = prod.stock;
            document.getElementById('prod-desc').value = prod.descripcion_lana;
            document.getElementById('prod-imagen-url-existente').value = prod.imagen_url || '';

            // Cambiar UI a modo edición
            document.getElementById('form-titulo').innerText = `Editar: ${prod.nombre}`;
            document.getElementById('btn-guardar').innerText = 'Actualizar Prenda';
            document.getElementById('btn-guardar').className = 'bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-6 rounded text-sm transition';
            document.getElementById('btn-cancelar-edicion').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('form-producto').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-imagen-url-existente').value = '';

            document.getElementById('form-titulo').innerText = 'Registrar Nueva Prenda';
            document.getElementById('btn-guardar').innerText = 'Guardar Producto en PostgreSQL';
            document.getElementById('btn-guardar').className = 'bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded text-sm transition';
            document.getElementById('btn-cancelar-edicion').classList.add('hidden');
        }

        async function guardarOActualizarProducto(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            const idEditando = document.getElementById('prod-id').value;
            const esEdicion = Boolean(idEditando);

            btn.disabled = true;
            btn.innerText = esEdicion ? 'Actualizando...' : 'Subiendo y guardando...';

            let imagenUrl = document.getElementById('prod-imagen-url-existente').value;
            const fileInput = document.getElementById('prod-foto');

            // 1. Subir nueva foto si se seleccionó una
            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('archivo', fileInput.files[0]);

                try {
                    const resImg = await fetch(`${API_URL}/productos/subir-imagen`, {
                        method: 'POST',
                        body: formData
                    });
                    if (resImg.ok) {
                        const imgData = await resImg.json();
                        imagenUrl = imgData.imagen_url;
                    }
                } catch (err) {
                    console.error("Fallo al subir imagen:", err);
                }
            }

            const datosProducto = {
                id_categoria: 1,
                codigo: document.getElementById('prod-codigo').value,
                nombre: document.getElementById('prod-nombre').value,
                precio: parseFloat(document.getElementById('prod-precio').value),
                stock: parseInt(document.getElementById('prod-stock').value),
                descripcion_lana: document.getElementById('prod-desc').value,
                imagen_url: imagenUrl
            };

            const urlPeticion = esEdicion ? `${API_URL}/productos/${idEditando}` : `${API_URL}/productos`;
            const metodoPeticion = esEdicion ? 'PUT' : 'POST';

            const res = await fetch(urlPeticion, {
                method: metodoPeticion,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datosProducto)
            });

            btn.disabled = false;

            if (res.ok) {
                alert(esEdicion ? 'Prenda actualizada correctamente.' : 'Prenda registrada con éxito.');
                cancelarEdicion();
                cargarInventario();
            } else {
                alert('Ocurrió un error al guardar. Verifica que el código no esté repetido.');
                btn.innerText = esEdicion ? 'Actualizar Prenda' : 'Guardar Producto en PostgreSQL';
            }
        }

        async function eliminarPrenda(id, nombre) {
            if (!confirm(`¿Seguro que deseas eliminar "${nombre}" del catálogo?`)) return;

            try {
                const res = await fetch(`${API_URL}/productos/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    cargarInventario();
                } else {
                    alert('No se pudo eliminar el producto del servidor.');
                }
            } catch (err) {
                alert('Error de conexión al intentar eliminar.');
            }
        }
    </script>
</body>
</html>
